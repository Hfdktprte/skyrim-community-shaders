name: ChatGPT Backport PR2716

on:
  push:
    branches:
      - chatgpt/pr2716-backport

permissions:
  contents: write

jobs:
  backport:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply PR2716 without duplicating grass clamp removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin aebf01c2efa0a1926d676dc66d2623aaf58cc866
          if git cherry-pick aebf01c2efa0a1926d676dc66d2623aaf58cc866; then
            echo "Cherry-pick applied cleanly."
          else
            echo "Resolving expected RunGrass conflict by keeping aio-dev grass shader."
            git checkout --ours package/Shaders/RunGrass.hlsl
            git add package/Shaders/RunGrass.hlsl
            git cherry-pick --continue
          fi
          git rm .github/workflows/chatgpt-backport-pr2716.yml
          git commit -m "ci: remove temporary PR2716 backport workflow"
          git push origin HEAD:chatgpt/pr2716-backport
